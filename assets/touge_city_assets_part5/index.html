<!doctype html><html lang="es"><meta charset="utf-8"><title>Parte 5 — Garaje + Skidmarks</title>
<body style="margin:0;background:#000;overflow:hidden;font:12px sans-serif;color:#9bd">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<div style="position:fixed;left:8px;top:6px;z-index:2">Parte 5 — garaje (arriba) / huellas dinámicas: arrastra para orbitar</div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {SkidMarks,DriftSmoke} from './skidmarks.js';
const q=new URLSearchParams(location.search);
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);r.toneMapping=THREE.ACESFilmicToneMapping;
const s=new THREE.Scene();s.background=new THREE.Color(0x0b0d12);const c=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
c.position.set(+q.get('cx')||0,+q.get('cy')||2.4,+q.get('cz')||4.8);const oc=new OrbitControls(c,r.domElement);oc.target.set(0,1,0);oc.update();
s.add(new THREE.HemisphereLight(0xcfd8ff,0x303540,1.6));
for(const [x,z] of [[-4,-3],[4,-3],[-4,3],[4,3]]){const p=new THREE.PointLight(0xfff0dd,25,14);p.position.set(x,4,z);s.add(p)}
const L=new GLTFLoader();
const put=(n,x,y,z,ry=0)=>L.load(`models/${n}.glb`,g=>{g.scene.position.set(x,y,z);g.scene.rotation.y=ry;s.add(g.scene)});
put('garage_room_night',0,0,0);
put('workbench_pegboard',0,0,-4.5);put('toolbox_rolling_chest',-2.3,0,-4.5);put('tire_rack_3x4',4.8,0,-3.5,-Math.PI/2);put('shelf_parts',-5.6,0,-2,Math.PI/2);put('car_lift_2post',-4.6,0,3);
put('tire_stack_4',3.8,0,-4.4);put('oil_barrel',5.2,0,4);put('hydraulic_jack',2.5,0,-4);put('air_compressor',-3.5,0,-4.3);put('work_light_stand',4.3,0,3.5);
put('poster_frame_a',-3,2.2,-4.88);put('poster_frame_b',3,2.2,-4.88);put('sign_garage_hanging',0,3.6,-4.85);put('fire_extinguisher',5.7,0,-4.5);
// huellas dinámicas en un exterior simulado: un coche virtual traza un 8 sobre el piso del garaje
const sk=new SkidMarks(s,{base:'./',width:.3});const sm=new DriftSmoke(s,{base:'./'});
const car=new THREE.Mesh(new THREE.BoxGeometry(1.6,.15,3.4),new THREE.MeshBasicMaterial({color:0x2288ff,transparent:true,opacity:.0}));s.add(car);
const clk=new THREE.Clock();let done=0;
(function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clk.getDelta()),t=clk.elapsedTime;
 const a=t*1.3,x=Math.sin(a)*5.5,z=Math.sin(a*2)*3.2;car.position.set(x,.1,z);const ax=Math.cos(a)*5.5*1.3,az=Math.cos(a*2)*6.4*1.3;car.rotation.y=Math.atan2(ax,az);
 const fwd=new THREE.Vector3(Math.sin(car.rotation.y),0,Math.cos(car.rotation.y)),side=new THREE.Vector3(fwd.z,0,-fwd.x);
 [[.7,-1.1],[-.7,-1.1]].forEach(([sx,sz],i)=>{const p=car.position.clone().addScaledVector(side,sx).addScaledVector(fwd,sz);sk.add('rear'+i,p,1);sm.emit(p,fwd.clone().multiplyScalar(-4),1,.9)});
 sk.update(dt);sm.update(dt);oc.update();r.render(s,c);if(!done&&t>+(q.get('wait')||0)&&t>4)done=window.done=1;})();
addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
</script>
